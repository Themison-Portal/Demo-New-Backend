services:
  # PostgreSQL with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: themison-new-db # host:container — using new name to avoid conflict with old themison-db
    restart: unless-stopped
    ports:
      - "5433:5432" # host:container — using 5433 on host to avoid conflict with old themison-db on 54322
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: themison_new
    volumes:
      - postgres_new_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Backend (caching, sessions)
  redis:
    image: redis:7-alpine
    container_name: themison-new-redis # host:container — using new name to avoid conflict with old themison-redis
    restart: unless-stopped
    ports:
      - "6380:6379" # host:container — using 6380 on host to avoid conflict with old themison-redis on 6379
    volumes:
      - redis_new_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: themison-new-backend # host:container — using new name to avoid conflict with old themison-backend
    restart: unless-stopped
    ports:
      - "8081:8080" # host:container — using 8081 on host to avoid conflict with old themison-backend on 8080
    environment:
      # Database (internal Docker network)
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/themison_new
      # Redis (internal Docker network)
      REDIS_URL: redis://redis:6379/0
      # API keys
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      UPLOAD_API_KEY: ${UPLOAD_API_KEY}
      # Auth0
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      # RAG service — points to OLD existing RAG service, no new RAG needed
      RAG_SERVICE_ADDRESS: ${RAG_SERVICE_ADDRESS:-localhost:50051}
      USE_GRPC_RAG: ${USE_GRPC_RAG:-false}
      # Local file URL for the RAG service to fetch uploaded PDFs from
      LOCAL_STORAGE_BASE_URL: ${LOCAL_STORAGE_BASE_URL:-http://localhost:8000}
      # CORS
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOW_ALL_ORIGINS: ${ALLOW_ALL_ORIGINS:-true}
    volumes:
      - backend_new_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_new_data:
  redis_new_data:
  backend_new_uploads:
