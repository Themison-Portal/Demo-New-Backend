services:
  # PostgreSQL with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: themison-new-db # host:container — using new name to avoid conflict with old themison-db
    restart: unless-stopped
    ports:
      - "5433:5432" # host:container — using 5433 on host to avoid conflict with old themison-db on 54322
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: themison_new
    volumes:
      - postgres_new_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Backend (caching, sessions)
  redis:
    image: redis:7-alpine
    container_name: themison-new-redis # host:container — using new name to avoid conflict with old themison-redis
    restart: unless-stopped
    ports:
      - "6380:6379" # host:container — using 6380 on host to avoid conflict with old themison-redis on 6379
    volumes:
      - redis_new_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RAG service — separate image built from ../rag-service.
  # Defaults to HTTP on 8000; set TRANSPORT=grpc to fall back.
  # Shares the new-platform Postgres (themison_new) with the BE so the
  # chunks table is the same one /query reads from.
  rag-service:
    build:
      context: ../rag-service
      dockerfile: Dockerfile
    container_name: themison-new-rag-service
    restart: unless-stopped
    ports:
      - "8001:8000" # host:container — 8001 on host to avoid clashing with other locally-running HTTP services
    environment:
      TRANSPORT: ${RAG_TRANSPORT:-http}
      HTTP_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/themison_new
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GRPC_PORT: 50051
      GRPC_MAX_WORKERS: 10
      HYBRID_SEARCH_ENABLED: "true"
      SEMANTIC_CACHE_SIMILARITY_THRESHOLD: "0.90"
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-20250514}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: themison-new-backend # host:container — using new name to avoid conflict with old themison-backend
    restart: unless-stopped
    ports:
      - "8081:8080" # host:container — using 8081 on host to avoid conflict with old themison-backend on 8080
    environment:
      # Database (internal Docker network)
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/themison_new
      # Redis (internal Docker network)
      REDIS_URL: redis://redis:6379/0
      # API keys
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      UPLOAD_API_KEY: ${UPLOAD_API_KEY}
      # Auth0
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      # RAG service — talks to the sibling rag-service container by Docker DNS.
      # Default transport is HTTP on :8000. Set USE_GRPC_RAG=true and adjust the
      # address to `rag-service:50051` to use the gRPC fallback.
      RAG_SERVICE_ADDRESS: ${RAG_SERVICE_ADDRESS:-http://rag-service:8000}
      USE_GRPC_RAG: ${USE_GRPC_RAG:-false}
      # Local file URL for the RAG service to fetch uploaded PDFs from.
      # rag-service container reaches the BE container via Docker DNS at
      # http://backend:8080 — no host.docker.internal trickery needed.
      LOCAL_STORAGE_BASE_URL: ${LOCAL_STORAGE_BASE_URL:-http://backend:8080}
      # CORS
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOW_ALL_ORIGINS: ${ALLOW_ALL_ORIGINS:-true}
    volumes:
      - backend_new_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # FE (Vite React client + Express tRPC server) — separate image built
  # from the FE repo's production Dockerfile. Shares the docker-compose
  # network with backend + rag-service so internal DNS works.
  # FE MySQL stays where it is (themison-fe-mysql in the old core-backendv4
  # compose) — reachable via host.docker.internal:3306 from inside this
  # container.
  frontend:
    build:
      context: ../NewFE/Demo-New-Frontend
      dockerfile: Dockerfile
      args:
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:-}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:-}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE:-}
        VITE_AUTH0_REDIRECT_URI: ${VITE_AUTH0_REDIRECT_URI:-}
        VITE_APP_ID: ${VITE_APP_ID:-}
        VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL:-}
    container_name: themison-new-frontend
    restart: unless-stopped
    ports:
      - "3002:3000" # host:container — match the dev-server host port
    environment:
      NODE_ENV: production
      PORT: 3000
      # FE MySQL is still in the old core-backendv4 compose project.
      # Reach it via the host gateway.
      DATABASE_URL: ${FE_DATABASE_URL:-mysql://themison:themison@host.docker.internal:3306/themison_fe}
      # BE reached by Docker DNS (sibling service in this compose).
      NEXT_PUBLIC_API_URL: http://backend:8080
      CORE_BACKEND_API_URL: http://backend:8080
      CORE_BACKEND_API_KEY: ${UPLOAD_API_KEY}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      PUBLIC_BASE_URL: ${FE_PUBLIC_BASE_URL:-http://localhost:3002}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_new_data:
  redis_new_data:
  backend_new_uploads:
